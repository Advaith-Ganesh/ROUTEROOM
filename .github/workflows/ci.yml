name: CI

on:
  push:
    branches: [Main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: routeroom
          POSTGRES_PASSWORD: routeroom
          POSTGRES_DB: routeroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routeroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://routeroom:routeroom@localhost:5432/routeroom_test?schema=public
      TEST_DATABASE_URL: postgresql://routeroom:routeroom@localhost:5432/routeroom_test?schema=public
      JWT_SECRET: ci_only_secret_used_for_github_actions_runs_1234567890

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run prisma:deploy --workspace server

      - name: Server tests
        run: npm run test --workspace server

      - name: Client tests
        run: npm run test --workspace client

      - name: Build
        run: npm run build
